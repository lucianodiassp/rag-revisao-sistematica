services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_systematic_review
    ports:
      - "127.0.0.1:${RAG_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/scripts/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_systematic_review"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - rag_network

  migrate:
    image: pgvector/pgvector:pg16
    container_name: rag_database_migrations
    restart: "no"
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: rag_systematic_review
      PGUSER: rag_user
      PGPASSWORD: rag_password
    volumes:
      - ./database/scripts:/migrations:ro
    entrypoint: ["/bin/sh", "/migrations/migrate.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rag_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${RAG_UID:-1000}
        APP_GID: ${RAG_GID:-1000}
    container_name: rag_streamlit_app
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: rag_systematic_review
      DB_USER: rag_user
      DB_PASSWORD: rag_password
      RAG_DEPLOYMENT_PROFILE: local
      RAG_USER_MODE: single_user
      AI_CONFIG_DATABASE_ENABLED: "true"
      AI_LOCAL_MASTER_KEY_PATH: /app/data/private/master.key
      PDF_DIRECTORY: /app/data/pdfs
      BACKUP_DIRECTORY: /app/data/backups
      PRIVATE_DIRECTORY: /app/data/private
      STREAMLIT_SERVER_MAX_UPLOAD_SIZE: ${RAG_MAX_UPLOAD_MB:-2048}
    ports:
      - "127.0.0.1:${RAG_APP_PORT:-8501}:8501"
    volumes:
      - ./.streamlit:/app/.streamlit:ro
      - ./data/pdfs:/app/data/pdfs
      - ./data/backups:/app/data/backups
      - app_private_data:/app/data/private
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - backend.app.operational_health
        - --component
        - app
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - rag_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${RAG_UID:-1000}
        APP_GID: ${RAG_GID:-1000}
    container_name: rag_background_worker
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: rag_systematic_review
      DB_USER: rag_user
      DB_PASSWORD: rag_password
      RAG_DEPLOYMENT_PROFILE: local
      RAG_USER_MODE: single_user
      AI_CONFIG_DATABASE_ENABLED: "true"
      AI_LOCAL_MASTER_KEY_PATH: /app/data/private/master.key
      PDF_DIRECTORY: /app/data/pdfs
      BACKUP_DIRECTORY: /app/data/backups
      PRIVATE_DIRECTORY: /app/data/private
      RAG_JOB_WORKERS: "1"
    command: ["python", "-m", "backend.app.job_worker"]
    volumes:
      - ./data/pdfs:/app/data/pdfs
      - ./data/backups:/app/data/backups
      - app_private_data:/app/data/private
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - backend.app.operational_health
        - --component
        - worker
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - rag_network

  backup-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${RAG_UID:-1000}
        APP_GID: ${RAG_GID:-1000}
    container_name: rag_backup_scheduler
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: rag_systematic_review
      DB_USER: rag_user
      DB_PASSWORD: rag_password
      RAG_DEPLOYMENT_PROFILE: local
      RAG_USER_MODE: single_user
      AI_LOCAL_MASTER_KEY_PATH: /app/data/private/master.key
      PDF_DIRECTORY: /app/data/pdfs
      BACKUP_DIRECTORY: /app/data/backups
      PRIVATE_DIRECTORY: /app/data/private
    command: ["python", "-m", "backend.app.external_backup"]
    volumes:
      - ./data/pdfs:/app/data/pdfs
      - ./data/backups:/app/data/backups
      - app_private_data:/app/data/private
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - backend.app.external_backup
        - --healthcheck
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - rag_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: rag_pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@rag.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "127.0.0.1:${RAG_PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rag_network

networks:
  rag_network:
    driver: bridge

volumes:
  postgres_data:
    name: rag_postgres_data
  app_private_data:
    name: rag_app_private_data
