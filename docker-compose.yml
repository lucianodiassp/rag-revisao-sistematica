services:
  # --------------------------------------------------------
  # PostgreSQL com pgvector (Banco de Dados Principal)
  # --------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres_db
    restart: always
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_systematic_review
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql # Mapeamento para auto-executar o schema
      - ./database/scripts/002_project_isolation.sql:/docker-entrypoint-initdb.d/z98_project_isolation.sql:ro
      - ./database/scripts/003_traceable_evidence.sql:/docker-entrypoint-initdb.d/z99_traceable_evidence.sql:ro
      - ./database/scripts/004_ai_configuration.sql:/docker-entrypoint-initdb.d/zz100_ai_configuration.sql:ro
      - ./database/scripts/005_bibliographic_sources.sql:/docker-entrypoint-initdb.d/zz101_bibliographic_sources.sql:ro
      - ./database/scripts/006_screening_reassessment.sql:/docker-entrypoint-initdb.d/zz102_screening_reassessment.sql:ro
      - ./database/scripts/007_explainable_deduplication.sql:/docker-entrypoint-initdb.d/zz103_explainable_deduplication.sql:ro
    networks:
      - rag_network

  # --------------------------------------------------------
  # pgAdmin (Interface Gráfica de Gestão do Banco)
  # --------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: rag_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rag.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - rag_network

networks:
  rag_network:
    driver: bridge

volumes:
  postgres_data:
    name: rag_postgres_data
